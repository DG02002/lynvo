packages:
  - apps/*
  - packages/*

allowBuilds:
  esbuild: true
  msgpackr-extract: true
  msw: true
  sharp: true
  workerd: true

blockExoticSubdeps: true

minimumReleaseAge: 10080
minimumReleaseAgeIgnoreMissingTime: false
minimumReleaseAgeStrict: true

strictDepBuilds: true

overrides:
  smol-toml: ^1.8.0

catalog:
  "@oxlint/plugins": ^1.92.0
  "@cloudflare/vitest-plugin": 1.6.0
  "@cloudflare/workers-types": 5.20261107.1
  "@types/node": ^26.6.6
  cheerio: ^1.2.0
  effect: ~4.1.2
  evlog: 2.35.1
  hono: 4.13.17
  husky: 9.1.7
  lint-staged: 17.6.0
  oxfmt: ^0.77.0
  oxlint: ^1.92.0
  oxlint-tsgolint: 7.0.2006
  sharp: ^0.35.5
  tsx: ^4.23.15
  typescript: ^7.0.2
  vite: ^8.3.6
  vitest: ^5
  wrangler: 4.158.0

saveWorkspaceProtocol: rolling

sharedWorkspaceLockfile: true

trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 10080
