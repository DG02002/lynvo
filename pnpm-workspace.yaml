packages:
  - apps/*
  - packages/*

allowBuilds:
  esbuild: true
  msgpackr-extract: true
  msw: true
  sharp: true
  workerd: true

blockExoticSubdeps: true

minimumReleaseAge: 10080
minimumReleaseAgeIgnoreMissingTime: false
minimumReleaseAgeStrict: true

strictDepBuilds: true

overrides:
  smol-toml: ^1.8.0

catalog:
  "@oxlint/plugins": ^1.86.0
  "@cloudflare/vitest-plugin": 1.3.6
  "@cloudflare/workers-types": 5.20261003.1
  "@types/node": ^26.6.4
  cheerio: ^1.2.0
  effect: rc
  evlog: 2.30.0
  hono: 4.13.12
  husky: 9.1.7
  lint-staged: 17.6.0
  oxfmt: ^0.71.0
  oxlint: ^1.86.0
  oxlint-tsgolint: 7.0.2003
  sharp: ^0.35.5
  tsx: ^4.23.15
  typescript: ^7.0.2
  vite: ^8.3.2
  vitest: ^4.1.11
  wrangler: 4.147.0

saveWorkspaceProtocol: rolling

sharedWorkspaceLockfile: true

trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 10080
