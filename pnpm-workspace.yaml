packages:
  - apps/*
  - packages/*

allowBuilds:
  esbuild: true
  msgpackr-extract: true
  msw: true
  sharp: true
  workerd: true

blockExoticSubdeps: true

minimumReleaseAge: 10080
# Temporary: remove once minimumReleaseAge accepts these versions.
minimumReleaseAgeExclude:
  - cn@0.2.6
  - "@cloudflare/vitest-plugin@1.1.8"
  - "@cloudflare/workerd-darwin-64@1.20260911.1"
  - "@cloudflare/workerd-darwin-arm64@1.20260911.1"
  - "@cloudflare/workerd-linux-64@1.20260911.1"
  - "@cloudflare/workerd-linux-arm64@1.20260911.1"
  - "@cloudflare/workerd-windows-64@1.20260911.1"
  - effect@4.0.0-rc.112
  - miniflare@5.20260911.0-alpha
  - workerd@1.20260911.1
  - wrangler@4.131.1
minimumReleaseAgeIgnoreMissingTime: false
minimumReleaseAgeStrict: true

strictDepBuilds: true

overrides:
  smol-toml: ^1.8.0

catalog:
  "@oxlint/plugins": ^1.81.0
  "@cloudflare/vitest-plugin": 1.1.8
  "@cloudflare/workers-types": 5.20260905.1
  "@types/node": ^26.4.1
  cheerio: ^1.2.0
  effect: rc
  evlog: 2.28.1
  hono: 4.13.7
  husky: 9.1.7
  lint-staged: 17.5.0
  oxfmt: ^0.66.0
  oxlint: ^1.81.0
  oxlint-tsgolint: 7.0.2001
  sharp: ^0.35.4
  tsx: ^4.23.13
  typescript: ^7.0.2
  vite: ^8.2.2
  vitest: ^4.1.11
  wrangler: 4.129.0

saveWorkspaceProtocol: rolling

sharedWorkspaceLockfile: true

trustPolicy: no-downgrade
trustPolicyExclude:
  - effect@4.0.0-rc.112
trustPolicyIgnoreAfter: 10080
