packages:
  - apps/*
  - packages/*

allowBuilds:
  esbuild: true
  msgpackr-extract: true
  msw: true
  sharp: true
  workerd: true

blockExoticSubdeps: true

minimumReleaseAge: 10080
# Temporary: remove once minimumReleaseAge accepts these versions.
minimumReleaseAgeExclude:
  - cn@0.2.6
  - "@cloudflare/vitest-plugin@1.1.8"
  - "@cloudflare/workerd-darwin-64@1.20260911.1"
  - "@cloudflare/workerd-darwin-arm64@1.20260911.1"
  - "@cloudflare/workerd-linux-64@1.20260911.1"
  - "@cloudflare/workerd-linux-arm64@1.20260911.1"
  - "@cloudflare/workerd-windows-64@1.20260911.1"
  - effect@4.0.0-rc.112
  - miniflare@5.20260911.0-alpha
  - workerd@1.20260911.1
  - wrangler@4.131.1
minimumReleaseAgeIgnoreMissingTime: false
minimumReleaseAgeStrict: true

strictDepBuilds: true

catalog:
  "@oxlint/plugins": ^1.80.0
  "@cloudflare/vitest-plugin": 1.1.8
  "@cloudflare/workers-types": 5.20260830.1
  "@types/node": ^26.4.0
  cheerio: ^1.2.0
  effect: rc
  evlog: 2.27.1
  hono: 4.13.5
  husky: 9.1.7
  lint-staged: 17.4.1
  oxfmt: ^0.65.0
  oxlint: ^1.80.0
  sharp: ^0.35.4
  tsx: ^4.23.13
  typescript: ^7.0.2
  vite: ^8.2.2
  vitest: ^4.1.11
  wrangler: 4.127.1

saveWorkspaceProtocol: rolling

sharedWorkspaceLockfile: true

trustPolicy: no-downgrade
trustPolicyExclude:
  - effect@4.0.0-rc.112
trustPolicyIgnoreAfter: 10080
