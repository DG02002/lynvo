packages:
  - "apps/*"
  - "packages/*"
  - "examples/*"

sharedWorkspaceLockfile: true
saveWorkspaceProtocol: rolling

allowBuilds:
  esbuild: true
  msgpackr-extract: true
  sharp: true
  workerd: true

catalog:
  "@cloudflare/workers-types": ^5.20260718.1
  cheerio: ^1.2.0
  hono: ^4.12.30
  oxfmt: ^0.59.0
  oxlint: ^1.74.0
  sharp: ^0.35.3
  typescript: ^6.0.3
  vite: ^8.1.5
  vitest: ^4.1.10
  wrangler: ^4.112.0
  zod: ^4.4.3

# minimumReleaseAge: 10080
# trustPolicy: no-downgrade
blockExoticSubdeps: true
trustPolicyExclude:
  - effect
