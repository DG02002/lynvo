packages:
  - apps/*
  - packages/*

allowBuilds:
  esbuild: true
  msgpackr-extract: true
  msw: true
  sharp: true
  workerd: true

blockExoticSubdeps: true

minimumReleaseAgeExclude:
  - '@asamuzakjp/css-color@6.0.7'
  - '@cloudflare/vitest-pool-workers@0.20.3'
  - '@cloudflare/workers-types@5.20260808.1'
  - '@types/node@26.2.0'
  - effect@4.0.0-beta.106
  - nanoid@3.3.18
  - tsx@4.23.11
  - wrangler@4.120.0

catalog:
  '@cloudflare/workers-types': ^5.20260808.1
  cheerio: ^1.2.0
  hono: ^4.13.1
  oxfmt: ^0.62.0
  oxlint: ^1.77.0
  sharp: ^0.35.3
  typescript: ^7.0.2
  vite: ^8.2.1
  vitest: ^4.1.10
  wrangler: ^4.120.0
  zod: ^4.4.3

saveWorkspaceProtocol: rolling

sharedWorkspaceLockfile: true

trustPolicyExclude:
  - effect
