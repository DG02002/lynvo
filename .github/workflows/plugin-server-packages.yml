name: Plugin Server packages

on:
  push:
    paths:
      - ".github/workflows/plugin-server-packages.yml"
      - "packages/plugin-server-protocol/**"
      - "packages/create-lynvo-plugin-server/**"
      - "examples/plugin-server/**"
      - "scripts/verify-plugin-server-release.mjs"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  pull_request:
    paths:
      - ".github/workflows/plugin-server-packages.yml"
      - "packages/plugin-server-protocol/**"
      - "packages/create-lynvo-plugin-server/**"
      - "examples/plugin-server/**"
      - "scripts/verify-plugin-server-release.mjs"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"

permissions:
  contents: read

jobs:
  protocol-and-starter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22.11.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @lynvo/plugin-server-protocol release:check
      - run: pnpm --filter create-lynvo-plugin-server check
      - run: pnpm --filter @lynvo/example-plugin-server check
      - run: pnpm --filter @lynvo/example-plugin-server test
      - run: pnpm check:plugin-server-release
