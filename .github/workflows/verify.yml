name: Verify

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  HUSKY: 0

jobs:
  workflow-security:
    name: Workflow security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with:
          advanced-security: false

  verify:
    name: Repository verification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_OPTIONS: --no-experimental-webstorage
      GOOGLE_CLIENT_ID: ci-test-google-client-id
      GOOGLE_CLIENT_SECRET: ci-test-google-client-secret
      PLUGIN_CREDENTIAL_ENCRYPTION_KEY: ci-test-plugin-credential-encryption-key
      MANAGED_PLUGIN_SERVER_API_KEY: ci-test-managed-plugin-server-api-key
      TMDB_API_READ_ACCESS_TOKEN: ci-test-tmdb-api-read-access-token
      PLUGIN_SERVER_AUTH_KEY: ci-test-plugin-server-auth-key
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          version: 12.0.0-rc.11
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26.7.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install the verified dependency graph
        run: pnpm install --frozen-lockfile
      - name: Verify generated assets are committed
        run: |
          pnpm images:optimize
          pnpm --filter @lynvo/lynvo-plugin-server images:optimize
          git diff --exit-code
      - name: Run repository checks
        run: pnpm check
      - name: Run the test suites
        run: pnpm test
      - name: Build the verified release
        run: pnpm build
      - name: Verify publishable package contents
        run: pnpm check:plugin-server-release
      - name: Upload verified release artifacts
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lynvo-release-${{ github.sha }}
          path: |
            apps/lynvo/build/client
            apps/lynvo/build/server
            apps/lynvo/dist/lynvo_plugin_server
            !apps/lynvo/build/server/.dev.vars
            !apps/lynvo/dist/lynvo_plugin_server/.dev.vars
          if-no-files-found: error
          retention-days: 1

  deploy-production:
    name: Deploy production
    needs:
      - workflow-security
      - verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: production
      queue: max
    environment: production
    env:
      COMMIT_HASH: ${{ github.sha }}
    steps:
      - name: Check out the verified commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify production credentials are available
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          for name in CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing production environment secret: ${name}"
              exit 1
            fi
          done

      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f3391d1d5d8b3a19a8cae5388b55320 # v5
        with:
          version: 12.0.0-rc.11
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26.7.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install the verified dependency graph
        run: pnpm install --frozen-lockfile

      - name: Set immutable release identity
        id: release
        run: |
          lynvo_package_version="$(node -p "require('./apps/lynvo/package.json').version")"
          plugin_server_package_version="$(node -p "require('./apps/lynvo-plugin-server/package.json').version")"
          printf 'tag=%s\n' "${COMMIT_HASH::12}" >> "$GITHUB_OUTPUT"
          printf 'lynvo_version=%s+%s\n' "$lynvo_package_version" "${COMMIT_HASH::12}" >> "$GITHUB_OUTPUT"
          printf 'plugin_server_version=%s+%s\n' "$plugin_server_package_version" "${COMMIT_HASH::12}" >> "$GITHUB_OUTPUT"

      - name: Verify deployment configuration
        env:
          LYNVO_VERSION: ${{ steps.release.outputs.lynvo_version }}
        run: SERVICE_VERSION="$LYNVO_VERSION" pnpm --filter @lynvo/app preflight

      - name: Download the verified release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: lynvo-release-${{ github.sha }}
          path: apps/lynvo

      - name: Apply pending D1 migrations to production
        working-directory: apps/lynvo
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: >-
          pnpm exec wrangler d1 migrations apply DB
          --config wrangler.jsonc
          --env=""
          --remote

      - name: Deploy Plugin Server
        id: deploy_plugin_server
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PLUGIN_SERVER_VERSION: ${{ steps.release.outputs.plugin_server_version }}
        run: >-
          pnpm --filter @lynvo/app exec wrangler deploy
          --config dist/lynvo_plugin_server/wrangler.json
          --env=""
          --message "GitHub ${COMMIT_HASH}"
          --var "SERVICE_VERSION:$PLUGIN_SERVER_VERSION"
          --var "COMMIT_HASH:$COMMIT_HASH"

      - name: Deploy Lynvo
        id: deploy_lynvo
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          LYNVO_VERSION: ${{ steps.release.outputs.lynvo_version }}
        run: >-
          pnpm --filter @lynvo/app exec wrangler deploy
          --config build/server/wrangler.json
          --env=""
          --message "GitHub ${COMMIT_HASH}"
          --var "SERVICE_VERSION:$LYNVO_VERSION"
          --var "COMMIT_HASH:$COMMIT_HASH"

      - name: Verify the expected Lynvo release is serving
        id: verify_release
        env:
          LYNVO_VERSION: ${{ steps.release.outputs.lynvo_version }}
        run: |
          for attempt in {1..30}; do
            if response="$(curl --fail --show-error --silent --retry 2 --retry-all-errors "https://lynvo.dg02002.workers.dev/api/version?release=${COMMIT_HASH}")"; then
              echo "Release identity (attempt ${attempt}/30):"
              jq . <<< "$response"
              if jq -e --arg commit "$COMMIT_HASH" --arg version "$LYNVO_VERSION" \
                '.commitHash == $commit and .serviceVersion == $version and (.deploymentId | length > 0)' \
                <<< "$response" >/dev/null; then
                echo "The expected release is active; verifying server-rendered application health."
                if curl --fail --show-error --silent --output /dev/null \
                  --retry 2 --retry-all-errors \
                  "https://lynvo.dg02002.workers.dev/?release=${COMMIT_HASH}"; then
                  exit 0
                fi
                echo "::error::The expected release is active, but the Lynvo homepage is unhealthy."
                exit 1
              fi
            fi
            sleep 2
          done
          echo "::error::The expected Lynvo release did not become active within 60 seconds."
          exit 1

      - name: Roll back Lynvo after a post-promotion failure
        if: failure() && steps.deploy_lynvo.outcome == 'success'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: >-
          pnpm --filter @lynvo/app exec wrangler rollback
          --config build/server/wrangler.json
          --env=""
          --message "Automatic rollback after release verification failed for ${COMMIT_HASH}"
          --yes

      - name: Roll back Plugin Server after a downstream failure
        if: failure() && steps.deploy_plugin_server.outcome == 'success'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: >-
          pnpm --filter @lynvo/app exec wrangler rollback
          --config dist/lynvo_plugin_server/wrangler.json
          --env=""
          --message "Automatic rollback after downstream release failure for ${COMMIT_HASH}"
          --yes
