name: Verify

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  workflow-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with:
          advanced-security: false

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          runtime: node@26.7.0
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - name: Verify generated assets are committed
        run: |
          pnpm images:optimize
          pnpm --filter @lynvo/lynvo-plugin-server images:optimize
          git diff --exit-code
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      - run: pnpm check:plugin-server-release

  deploy-production:
    name: Deploy production
    needs:
      - workflow-security
      - verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: production
      queue: max
    environment: production
    env:
      COMMIT_HASH: ${{ github.sha }}
    steps:
      - name: Check out the verified commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify production credentials are available
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          CONVEX_MIGRATION_KEY: ${{ secrets.CONVEX_MIGRATION_KEY }}
        run: |
          for name in CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN CONVEX_DEPLOY_KEY CONVEX_MIGRATION_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing production environment secret: ${name}"
              exit 1
            fi
          done

      - uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          runtime: node@26.7.0
          cache: true
          install: false

      - name: Install the verified dependency graph
        run: pnpm install --frozen-lockfile

      - name: Set immutable release identity
        id: release
        run: |
          lynvo_package_version="$(node -p "require('./apps/lynvo/package.json').version")"
          plugin_server_package_version="$(node -p "require('./apps/lynvo-plugin-server/package.json').version")"
          printf 'tag=%s\n' "${COMMIT_HASH::12}" >> "$GITHUB_OUTPUT"
          printf 'lynvo_version=%s+%s\n' "$lynvo_package_version" "${COMMIT_HASH::12}" >> "$GITHUB_OUTPUT"
          printf 'plugin_server_version=%s+%s\n' "$plugin_server_package_version" "${COMMIT_HASH::12}" >> "$GITHUB_OUTPUT"

      - name: Verify deployment configuration
        env:
          LYNVO_VERSION: ${{ steps.release.outputs.lynvo_version }}
        run: SERVICE_VERSION="$LYNVO_VERSION" pnpm --filter @lynvo/app preflight

      - name: Build release artifacts
        run: pnpm build

      - name: Verify Convex deployment inputs
        working-directory: apps/lynvo
        run: |
          test -f convex.json
          test -f convex/tsconfig.json

      - name: Verify Convex generated code is committed
        working-directory: apps/lynvo
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: |
          pnpm exec convex codegen --typecheck enable
          git diff --exit-code -- convex/_generated

      - name: Deploy backward-compatible Convex functions and schema
        working-directory: apps/lynvo
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: >-
          pnpm exec convex deploy
          --typecheck enable
          --codegen disable
          --message "GitHub ${COMMIT_HASH}"

      - name: Start reviewed production migrations
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_MIGRATION_KEY }}
        run: pnpm --filter @lynvo/app exec convex run migrations:runProduction '{}'

      - name: Wait for production migrations and invariants
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_MIGRATION_KEY }}
          NODE_OPTIONS: --disable-warning=ExperimentalWarning
        run: |
          migration_names='{"names":["migrations:normalizeSavedLinkRetention","migrations:backfillUserStorageLedgersV2"]}'

          for attempt in {1..90}; do
            migration_status="$(pnpm --filter @lynvo/app exec convex run --component migrations lib:getStatus "$migration_names")"
            echo "Migration status (attempt ${attempt}/90):"
            jq . <<< "$migration_status"

            if jq -e 'any(.[]; .state == "failed" or .state == "canceled")' <<< "$migration_status" >/dev/null; then
              echo "::error::A production migration failed. See the status above."
              exit 1
            fi

            if jq -e 'length == 2 and all(.[]; .state == "success" and .isDone == true)' <<< "$migration_status" >/dev/null; then
              break
            fi

            if [ "$attempt" -eq 90 ]; then
              echo "::error::Production migrations did not complete within 15 minutes."
              exit 1
            fi
            sleep 10
          done

          retention="$(pnpm --filter @lynvo/app exec convex run migrations:verifySavedLinkRetention '{}')"
          ledgers="$(pnpm --filter @lynvo/app exec convex run migrations:verifyUserStorageLedgers '{}')"

          echo "Saved-link retention invariant:"
          jq . <<< "$retention"
          echo "User storage-ledger invariant:"
          jq . <<< "$ledgers"

          if ! jq -e '.isComplete == true' <<< "$retention" >/dev/null; then
            echo "::error::Saved-link retention invariant failed."
            exit 1
          fi

          if ! jq -e '.isComplete == true' <<< "$ledgers" >/dev/null; then
            echo "::error::User storage-ledger invariant failed."
            exit 1
          fi

      - name: Upload inactive Plugin Server version
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PLUGIN_SERVER_VERSION: ${{ steps.release.outputs.plugin_server_version }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: >-
          pnpm --filter @lynvo/lynvo-plugin-server exec wrangler versions upload
          --config wrangler.jsonc
          --env=""
          --tag "$RELEASE_TAG"
          --message "GitHub ${COMMIT_HASH}"
          --var "SERVICE_VERSION:$PLUGIN_SERVER_VERSION"
          --var "COMMIT_HASH:$COMMIT_HASH"

      - name: Upload inactive Lynvo version
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          LYNVO_VERSION: ${{ steps.release.outputs.lynvo_version }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: >-
          pnpm --filter @lynvo/app exec wrangler versions upload
          --config wrangler.jsonc
          --tag "$RELEASE_TAG"
          --message "GitHub ${COMMIT_HASH}"
          --var "SERVICE_VERSION:$LYNVO_VERSION"
          --var "COMMIT_HASH:$COMMIT_HASH"

      - name: Promote Plugin Server
        id: promote_plugin_server
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: >-
          pnpm --filter @lynvo/lynvo-plugin-server exec wrangler versions deploy
          --config wrangler.jsonc
          --env=""
          --version-tag "$RELEASE_TAG"
          --message "GitHub ${COMMIT_HASH}"
          --yes

      - name: Promote Lynvo
        id: promote_lynvo
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: >-
          pnpm --filter @lynvo/app exec wrangler versions deploy
          --config wrangler.jsonc
          --version-tag "$RELEASE_TAG"
          --message "GitHub ${COMMIT_HASH}"
          --yes

      - name: Roll back Plugin Server if Lynvo promotion fails
        if: failure() && steps.promote_plugin_server.outcome == 'success' && steps.promote_lynvo.outcome == 'failure'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: >-
          pnpm --filter @lynvo/lynvo-plugin-server exec wrangler rollback
          --config wrangler.jsonc
          --env=""
          --message "Automatic rollback after Lynvo promotion failed for ${COMMIT_HASH}"
          --yes

      - name: Verify production is reachable
        run: curl --fail --show-error --silent --retry 5 --retry-all-errors https://lynvo.dg02002.workers.dev/api/version
