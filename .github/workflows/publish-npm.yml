name: Publish npm package

on:
  push:
    tags:
      - protocol-v*.*.*
      - creator-v*.*.*
      - "!protocol-v*-*"
      - "!creator-v*-*"

permissions:
  contents: read

env:
  HUSKY: 0

concurrency:
  group: npm-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_OPTIONS: --no-experimental-webstorage
      GOOGLE_CLIENT_ID: ci-test-google-client-id
      GOOGLE_CLIENT_SECRET: ci-test-google-client-secret
      PLUGIN_CREDENTIAL_ENCRYPTION_KEY: ci-test-plugin-credential-encryption-key
      MANAGED_PLUGIN_SERVER_API_KEY: ci-test-managed-plugin-server-api-key
      TMDB_API_READ_ACCESS_TOKEN: ci-test-tmdb-api-read-access-token
      PLUGIN_SERVER_AUTH_KEY: ci-test-plugin-server-auth-key
    outputs:
      package-version: ${{ steps.release.outputs.package-version }}
    steps:
      - name: Check out tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false
          persist-credentials: false

      # No pnpm store cache: this job builds the artifact that npm publish ships,
      # so the dependency graph must come from the lockfile, not a restored cache
      # (zizmor cache-poisoning).
      - name: Set up pnpm 12 and Node.js
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          version: 12.5.1
          runtime: node@26.12.0
          cache: false
          install: false

      - name: Update pnpm
        run: pnpm self-update

      - name: Install the tagged dependency graph
        run: pnpm install --frozen-lockfile

      - name: Resolve and verify release identity
        id: release
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Package release tag ${GITHUB_REF_NAME} does not point to a commit on main"
            exit 1
          fi
          case "$GITHUB_REF_NAME" in
            protocol-v*)
              package_directory="packages/plugin-server-protocol"
              package_filter="@dg02002/lynvo-plugin-server-protocol"
              package_version="${GITHUB_REF_NAME#protocol-v}"
              ;;
            creator-v*)
              package_directory="packages/create-lynvo-plugin-server"
              package_filter="create-lynvo-plugin-server"
              package_version="${GITHUB_REF_NAME#creator-v}"
              ;;
            *)
              exit 1
              ;;
          esac
          manifest_version="$(node -p "require('./${package_directory}/package.json').version")"
          test "$package_version" = "$manifest_version"
          echo "PACKAGE_DIRECTORY=$package_directory" >> "$GITHUB_ENV"
          echo "PACKAGE_FILTER=$package_filter" >> "$GITHUB_ENV"
          echo "PACKAGE_VERSION=$package_version" >> "$GITHUB_ENV"
          echo "package-version=$package_version" >> "$GITHUB_OUTPUT"

      - name: Run complete release checks
        run: |
          pnpm images:optimize
          pnpm --filter @lynvo/lynvo-plugin-server images:optimize
          git diff --exit-code
          pnpm check
          pnpm test
          pnpm test:workers
          pnpm build
          pnpm check:plugin-server-release

      - name: Confirm this version is unpublished
        run: |
          package_name="$(node -p "require('./${PACKAGE_DIRECTORY}/package.json').name")"
          if pnpm view "${package_name}@${PACKAGE_VERSION}" version >/dev/null 2>&1; then
            echo "${package_name}@${PACKAGE_VERSION} is already published" >&2
            exit 1
          fi

      - name: Pack the reviewed package
        run: |
          mkdir release-artifacts
          pnpm --filter "$PACKAGE_FILTER" pack --pack-destination "$GITHUB_WORKSPACE/release-artifacts"
          cd release-artifacts
          test "$(find . -maxdepth 1 -name '*.tgz' | wc -l | tr -d ' ')" = "1"
          sha256sum ./*.tgz > SHA256SUMS

      - name: Store the release artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-${{ github.ref_name }}
          path: release-artifacts
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish package
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.12.0
          package-manager-cache: false

      - name: Verify npm supports trusted publishing
        run: |
          npm_version="$(npm --version)"
          node -e 'const [major, minor] = process.argv[1].split(".").map(Number); if (major < 11 || (major === 11 && minor < 5)) process.exit(1)' "$npm_version"

      - name: Download the verified package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-${{ github.ref_name }}
          path: release-artifacts

      - name: Verify and publish with trusted publishing
        run: |
          cd release-artifacts
          sha256sum --check SHA256SUMS
          test "$(find . -maxdepth 1 -name '*.tgz' | wc -l | tr -d ' ')" = "1"
          npm publish ./*.tgz --access public --provenance

  release:
    name: Create package GitHub release
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Resolve package release title
        id: release
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          case "$TAG_NAME" in
            protocol-v*)
              package_name="@dg02002/lynvo-plugin-server-protocol"
              package_version="${TAG_NAME#protocol-}"
              ;;
            creator-v*)
              package_name="create-lynvo-plugin-server"
              package_version="${TAG_NAME#creator-}"
              ;;
            *)
              echo "::error::Unsupported package release tag: ${TAG_NAME}"
              exit 1
              ;;
          esac
          printf 'title=%s %s\n' "$package_name" "$package_version" >> "$GITHUB_OUTPUT"

      - name: Create package GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TITLE: ${{ steps.release.outputs.title }}
          TAG_NAME: ${{ github.ref_name }}
        run: gh release create "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "$RELEASE_TITLE"
