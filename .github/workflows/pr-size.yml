name: PR size

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  label:
    name: Label PR size
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: pr-size-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: Calculate and sync PR size
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const labelFile = await github.rest.repos.getContent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: ".github/labels.json",
              ref: context.payload.repository.default_branch,
            });

            if (Array.isArray(labelFile.data) || labelFile.data.type !== "file") {
              throw new Error(".github/labels.json must be a file");
            }

            const allLabels = JSON.parse(
              Buffer.from(labelFile.data.content, "base64").toString("utf8"),
            );
            const managedLabels = allLabels.filter((label) => label.name.startsWith("size:"));
            const managedLabelNames = new Set(managedLabels.map((label) => label.name));
            const pullRequestNumber = context.payload.pull_request.number;
            const changedFiles = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pullRequestNumber,
              per_page: 100,
            });
            const changedLines = changedFiles.reduce(
              (total, file) => total + (Number(file.additions) || 0) + (Number(file.deletions) || 0),
              0,
            );
            const sizeBands = managedLabels
              .filter((label) => Number.isInteger(label.maximumChangedLines))
              .sort((leftLabel, rightLabel) =>
                leftLabel.maximumChangedLines - rightLabel.maximumChangedLines,
              );
            const largestSizeLabel = managedLabels.find(
              (label) => !Number.isInteger(label.maximumChangedLines),
            );
            const nextLabelName =
              sizeBands.find((sizeBand) => changedLines <= sizeBand.maximumChangedLines)?.name ??
              largestSizeLabel?.name;

            if (!nextLabelName || !managedLabelNames.has(nextLabelName)) {
              throw new Error(`Missing managed label definition: ${nextLabelName}`);
            }

            for (const label of managedLabels) {
              try {
                const { data: existingLabel } = await github.rest.issues.getLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label.name,
                });

                if (
                  existingLabel.color !== label.color ||
                  (existingLabel.description ?? "") !== label.description
                ) {
                  await github.rest.issues.updateLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    name: label.name,
                    color: label.color,
                    description: label.description,
                  });
                }
              } catch (error) {
                if (error.status !== 404) {
                  throw error;
                }

                try {
                  await github.rest.issues.createLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    name: label.name,
                    color: label.color,
                    description: label.description,
                  });
                } catch (createError) {
                  if (createError.status !== 422) {
                    throw createError;
                  }
                }
              }
            }

            const { data: currentLabels } = await github.rest.issues.listLabelsOnIssue({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pullRequestNumber,
              per_page: 100,
            });

            for (const label of currentLabels) {
              if (!managedLabelNames.has(label.name) || label.name === nextLabelName) {
                continue;
              }

              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pullRequestNumber,
                  name: label.name,
                });
              } catch (error) {
                if (error.status !== 404) {
                  throw error;
                }
              }
            }

            if (!currentLabels.some((label) => label.name === nextLabelName)) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pullRequestNumber,
                labels: [nextLabelName],
              });
            }

            core.info(`PR #${pullRequestNumber}: ${changedLines} changed lines -> ${nextLabelName}`);
